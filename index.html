<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Hoopz Online 2D</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; background: #111; font-family: sans-serif; color: white; text-align: center; }
        #ui-container { padding: 10px; background: #222; }
        input, select, button { padding: 8px; margin: 5px; border-radius: 4px; border: none; }
        button { background: #ff9900; font-weight: bold; cursor: pointer; color: black; }
        #game-container { display: flex; justify-content: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h3>2D Character & Jukebox Customizer</h3>
        <label>Shoe Model: </label>
        <select id="shoeSelect">
            <option value="jordan1">Air Jordan 1</option>
            <option value="kobe6">Kobe 6 Grinch</option>
            <option value="lebron20">LeBron 20</option>
            <option value="curry10">Curry 10</option>
        </select>

        <label>Court Size: </label>
        <select id="courtSelect">
            <option value="half">Half Court</option>
            <option value="full">Full Court</option>
        </select>

        <input type="text" id="ytUrl" placeholder="Paste YouTube URL here">
        <button onclick="loadMusic()">Play Music</button>
        <p style="font-size: 12px; color: #aaa; margin: 5px;">Controls: Left/Right Arrows = Move | Up Arrow = Jump | <strong>C Key = Summon/Call Ball</strong></p>
    </div>

    <div id="game-container"></div>
    <div id="youtube-audio"></div>

    <script>
        // YouTube Audio Setup
        let player;
        function loadMusic() {
            const url = document.getElementById('ytUrl').value;
            let videoId = "";
            if(url.includes('v=')) { videoId = url.split('v=')[1].split('&')[0]; } 
            else if(url.includes('youtu.be/')) { videoId = url.split('youtu.be/')[1].split('?')[0]; }
            
            if (!videoId) return alert("Invalid YouTube URL");
            
            if (player) { player.loadVideoById(videoId); } 
            else {
                let tag = document.createElement('script');
                tag.src = "https://youtube.com";
                document.head.appendChild(tag);
                window.onYouTubeIframeAPIReady = () => {
                    player = new YT.Player('youtube-audio', {
                        height: '0', width: '0', videoId: videoId,
                        events: { 'onReady': (e) => e.target.playVideo() }
                    });
                };
            }
        }

        // Pure 2D Game Settings
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 500,
            parent: 'game-container',
            physics: { 
                default: 'arcade', 
                arcade: { gravity: { y: 600 }, debug: false } 
            },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);
        let playerSprite, ball, cursors, keyC, hoop;

        function preload() {}

        function create() {
            // Draw 2D Hardwood Floor Look
            let platforms = this.physics.add.staticGroup();
            let floor = this.add.rectangle(400, 480, 800, 40, 0xd2a679); // Wood color
            platforms.add(floor);

            // Draw a simple 2D Backboard and Rim Outline
            this.add.rectangle(750, 200, 10, 80, 0xffffff); // Backboard
            hoop = this.add.rectangle(725, 230, 40, 8, 0xff5500); // Rim
            this.physics.add.existing(hoop, true);

            // 2D Player Box Sprite
            playerSprite = this.add.rectangle(100, 400, 40, 70, 0x00aaff);
            this.physics.add.existing(playerSprite);
            playerSprite.body.setCollideWorldBounds(true);

            // 2D Ball Circle Sprite
            ball = this.add.circle(400, 200, 12, 0xe65c00);
            this.physics.add.existing(ball);
            ball.body.setCollideWorldBounds(true);
            ball.body.setBounce(0.75); // Makes the ball bounce nicely on the 2D floor

            // Core 2D Collision Mapping
            this.physics.add.collider(playerSprite, platforms);
            this.physics.add.collider(ball, platforms);
            this.physics.add.collider(playerSprite, ball);
            this.physics.add.overlap(ball, hoop, scorePoints, null, this);

            // Controls configuration
            cursors = this.input.keyboard.createCursorKeys();
            keyC = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.C);

            // Customizer Shoe Colors
            document.getElementById('shoeSelect').addEventListener('change', (e) => {
                if(e.target.value === 'kobe6') playerSprite.setFillStyle(0x39ff14); // Grinch Green
                if(e.target.value === 'jordan1') playerSprite.setFillStyle(0xcc0000); // Bred Red
                if(e.target.value === 'lebron20') playerSprite.setFillStyle(0xff00ff); // Pink
                if(e.target.value === 'curry10') playerSprite.setFillStyle(0xffcc00); // Golden State Yellow
            });
        }

        function update() {
            // Horizontal 2D Player Movement
            if (cursors.left.isDown) { playerSprite.body.setVelocityX(-250); }
            else if (cursors.right.isDown) { playerSprite.body.setVelocityX(250); }
            else { playerSprite.body.setVelocityX(0); }

            // Vertical 2D Jumping Mechanics
            if (cursors.up.isDown && playerSprite.body.touching.down) { playerSprite.body.setVelocityY(-420); }

            // **C Key Feature**: Instant Ball Summon to Player's Hands
            if (Phaser.Input.Keyboard.JustDown(keyC)) {
                ball.setPosition(playerSprite.x, playerSprite.y - 50);
                ball.body.setVelocity(0, 0); // Stops previous momentum completely
            }
        }

            function scorePoints(ballSim, net) {
            ball.setPosition(400, 100);
            ball.body.setVelocity(0, 0);
            // Brief visual notification on the 2D screen instead of an annoying alert pop-up
            let scoreText = this.add.text(350, 150, 'BUCKET!', { fontSize: '32px', fill: '#ff9900', fontWeight: 'bold' });
            this.time.delayedCall(1000, () => { scoreText.destroy(); });
        }
    </script>
</body>
</html>
