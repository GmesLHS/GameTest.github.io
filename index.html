<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Hoops 3D: First Person</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 15, 15, 0.95);
            z-index: 10;
            transition: opacity 0.2s ease, visibility 0.2s;
            visibility: visible;
            opacity: 1;
        }

        .panel {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #ff6600;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.3);
            text-align: center;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 { color: #ff6600; margin: 0 0 10px 0; font-size: 2.5rem; letter-spacing: 2px; }
        label { font-weight: bold; font-size: 0.9rem; color: #aaa; text-align: left; }
        input, select, button {
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: #ff6600; }
        button {
            background: #ff6600;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        button:hover { background: #e05500; }

        /* Hidden Utility Class */
        .hidden { 
            opacity: 0 !important; 
            visibility: hidden !important; 
            pointer-events: none !important; 
        }

        /* Heads Up Display (HUD) */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-card { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 6px; }

        /* Crosshair for FP Shooting */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        
        #interaction-prompt {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 4px;
            border: 1px solid #ff6600;
            pointer-events: none;
            display: none;
            z-index: 5;
        }
    </style>

    <!-- Include Three.js for 3D engine capabilities -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- HUD Overlay -->
    <div id="hud">
        <div class="hud-card" id="hud-user">PLAYER: User</div>
        <div class="hud-card" style="color:#ff6600;" id="hud-status">STANDBY</div>
        <div class="hud-card" id="hud-score">SCORE: 0</div>
    </div>

    <!-- First Person Reticle -->
    <div id="crosshair"></div>
    <div id="interaction-prompt">Press [C] to Pick Up Ball</div>

    <!-- Home Screen -->
    <div id="home-screen" class="overlay">
        <div class="panel">
            <h1>STREET HOOPS 3D</h1>
            <p style="color:#777; margin:0;">First Person Online Playground</p>
            
            <input type="text" id="username-input" value="BallerX" placeholder="Enter Username">
            
            <label>Select Kickz</label>
            <select id="shoe-select">
                <option value="0xff0000">Air Jordan 1 Retro (Bred)</option>
                <option value="0xffffff">Air Force 1 Low (Whiteout)</option>
                <option value="0xff6600">LeBron 20 (Trinity)</option>
                <option value="0x7000ff">Kobe 6 Protro (Mambacita)</option>
                <option value="0x99ff00">MB.03 (LaFrance)</option>
            </select>

            <button onclick="startGame()">Enter Playground</button>
            <button style="background:#444;" onclick="openSettings()">Settings</button>
        </div>
    </div>

    <!-- Settings Screen (Starts Hidden) -->
    <div id="settings-screen" class="overlay hidden">
        <div class="panel">
            <h2>Game Settings</h2>
            
            <div style="text-align:left;">
                <label for="brightness-slider">Court Brightness</label>
                <input type="range" id="brightness-slider" min="0.2" max="2.0" step="0.1" value="1.0" style="width:100%;">
            </div>

            <div style="text-align:left;">
                <label>Music Link (YouTube URL)</label>
                <input type="text" id="music-url" placeholder="https://youtube.com...">
            </div>

            <button onclick="applySettings()">Save & Back</button>
        </div>
    </div>

    <!-- JavaScript Game Engine Logic -->
    <script>
        // --- Core Framework Objects ---
        let scene, camera, renderer, ambientLight, directionalLight;
        let username = "BallerX";
        let score = 0;
        let isPlaying = false;

        // Physics/Control state arrays
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let playerVelocity = new THREE.Vector3();
        let playerDirection = new THREE.Vector3();
        let isGrounded = true;

        // Game specific structural items
        let basketball, courtFloor, hoopRim;
        let ballPhysics = {
            velocity: new THREE.Vector3(0, 0, 0),
            isHeld: true,
            radius: 0.4,
            gravity: -0.015,
            bounciness: 0.72
        };

        // Camera control variables 
        let yaw = 0, pitch = 0;
        const lookSpeed = 0.002;

        // Crowd animations tracking array
        let crowdMembers = [];

        // --- Init Environment Setup ---
        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a14);
            scene.fog = new THREE.FogExp2(0x0a0a14, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 12); // First Person viewpoint height

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Illumination Configurations
            ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            directionalLight = new THREE.DirectionalLight(0xffaa66, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            buildBasketballCourt();
            buildCrowds();
            spawnBasketball();

            // Hook Event Actions
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            
            // Pointer lock lock down for absolute First Person experience
            renderer.domElement.addEventListener('click', () => {
                if(isPlaying) renderer.domElement.requestPointerLock();
            });
        }

        // --- Build Authentic Court Map & Stadium Elements ---
        function buildBasketballCourt() {
            const courtGeo = new THREE.BoxGeometry(28, 0.2, 15);
            
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d2a06a'; ctx.fillRect(0,0,256,256);
            ctx.fillStyle = '#b5804c';
            for(let i=0; i<256; i+=16) { ctx.fillRect(0, i, 256, 2); }
            
            const courtTexture = new THREE.CanvasTexture(canvas);
            const courtMat = new THREE.MeshStandardMaterial({ map: courtTexture, roughness: 0.3 });
            courtFloor = new THREE.Mesh(courtGeo, courtMat);
            courtFloor.position.y = -0.1;
            courtFloor.receiveShadow = true;
            scene.add(courtFloor);

            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            
            const centerCircleGeo = new THREE.RingGeometry(2, 2.1, 32);
            const centerCircle = new THREE.Mesh(centerCircleGeo, lineMat);
            centerCircle.rotation.x = -Math.PI / 2;
            centerCircle.position.y = 0.01;
            scene.add(centerCircle);

            const outLineGeo = new THREE.BoxGeometry(28.2, 0.02, 15.2);
            const outLine = new THREE.Mesh(outLineGeo, new THREE.MeshBasicMaterial({color: 0xff6600, wireframe: true}));
            outLine.position.y = 0.01;
            scene.add(outLine);

            const postGeo = new THREE.CylinderGeometry(0.1, 0.1, 5);
            const postMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const post = new THREE.Mesh(postGeo, postMat);
            post.position.set(13.5, 2.5, 0);
            scene.add(post);

            const boardGeo = new THREE.BoxGeometry(0.2, 1.8, 2.8);
            const boardMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            const backboard = new THREE.Mesh(boardGeo, boardMat);
            backboard.position.set(13.3, 4.2, 0);
            scene.add(backboard);

            const rimGeo = new THREE.TorusGeometry(0.5, 0.04, 8, 24);
            const rimMat = new THREE.MeshBasicMaterial({ color: 0xff4500 });
            hoopRim = new THREE.Mesh(rimGeo, rimMat);
            hoopRim.rotation.x = Math.PI / 2;
            hoopRim.position.set(12.4, 3.6, 0);
            scene.add(hoopRim);
        }

        // --- Build Jumping Crowds ---
        function buildCrowds() {
            const crowdContainer = new THREE.Group();
            const fanColors = [0xff3333, 0x3333ff, 0x33ff33, 0xffff33, 0xff00ff];

            for (let x = -13; x <= 13; x += 1.5) {
                const color = fanColors[Math.floor(Math.random() * fanColors.length)];
                const fanGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.2, 8);
                const fanMat = new THREE.MeshStandardMaterial({ color: color });
                const fan = new THREE.Mesh(fanGeo, fanMat);
                
                fan.position.set(x, 0.6, -8);
                
                fan.userData = { 
                    jumpPhase: Math.random() * Math.PI, 
                    jumpSpeed: 0.05 + Math.random() * 0.08 
                };
                
                crowdContainer.add(fan);
                crowdMembers.push(fan);
            }
            scene.add(crowdContainer);
        }

        // --- Item Asset Constructors ---
        function spawnBasketball() {
            const ballGeo = new THREE.SphereGeometry(ballPhysics.radius, 16, 16);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xe65c00, roughness: 0.6 });
            basketball = new THREE.Mesh(ballGeo, ballMat);
            basketball.castShadow = true;
            scene.add(basketball);
        }

        // --- UI Panel Navigation Updates ---
        function openSettings() {
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('settings-screen').classList.remove('hidden');
        }

        function applySettings() {
            // Adjust light states directly
            const brightVal = document.getElementById('brightness-slider').value;
            ambientLight.intensity = parseFloat(brightVal);
            
            // Switch panels clean
            document.getElementById('settings-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
        }

        function startGame() {
            username = document.getElementById('username-input').value || "BallerX";
            document.getElementById('hud-user').innerText = `PLAYER: ${username.toUpperCase()}`;
            document.getElementById('home-screen').classList.add('hidden');
            
            document.getElementById('hud-status').innerText = "LIVE PLAYGROUND";
            isPlaying = true;
            renderer.domElement.requestPointerLock();
        }

        // --- Input Controls ---
        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveForward = true; break;
                case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                case 'KeyD': case 'ArrowRight': moveRight = true; break;
                case 'Space': 
                    if (ballPhysics.isHeld && isPlaying) {
                        shootBall();
                    } else if (isGrounded && isPlaying) {
                        playerVelocity.y = 0.25;
                        isGrounded = false;
                    }
                    break;
                case 'KeyC':
                    if (!ballPhysics.isHeld) {
                        let dist = camera.position.distanceTo(basketball.position);
                        if(dist < 3.0) {
                            ballPhysics.isHeld = true;
                            document.getElementById('interaction-prompt').style.display = 'none';
                        }
                    }
                    break;
                case 'Escape':
                    isPlaying = false;
                    document.getElementById('home-screen').classList.remove('hidden');
                    break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveForward = false; break;
                case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                case 'KeyD': case 'ArrowRight': moveRight = false; break;
            }
        }

        function onMouseMove(e) {
            if (document.pointerLockElement !== renderer.domElement) return;

            yaw -= e.movementX * lookSpeed;
            pitch -= e.movementY * lookSpeed;
            pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));

            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        }

        // --- Engine Physics Processing & Motion Loops ---
        function shootBall() {
            ballPhysics.isHeld = false;
            const launchVector = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            launchVector.normalize();
            
            ballPhysics.velocity.copy(launchVector).multiplyScalar(0.35);
            ballPhysics.velocity.y += 0.15; 
        }

        function updatePhysics() {
            if (!isPlaying) return;

            // --- First Person Movement Actions ---
            playerVelocity.x -= playerVelocity.x * 0.1;
            playerVelocity.z -= playerVelocity.z * 0.1;
            if(!isGrounded) playerVelocity.y -= 0.01;

            playerDirection.z = Number(moveForward) - Number(moveBackward);
            playerDirection.x = Number(moveRight) - Number(moveLeft);
            playerDirection.normalize();

            const camYawRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0));
            
            if (moveForward || moveBackward) {
                const forwardMove = new THREE.Vector3(0, 0, -playerDirection.z).applyQuaternion(camYawRotation);
                playerVelocity.add(forwardMove.multiplyScalar(0.02));
            }
            if (moveLeft || moveRight) {
                const sideMove = new THREE.Vector3(playerDirection.x, 0, 0).applyQuaternion(camYawRotation);
                playerVelocity.add(sideMove.multiplyScalar(0.02));
            }

            camera.position.add(playerVelocity);

            if (camera.position.y < 2.0) {
                camera.position.y = 2.0;
                playerVelocity.y = 0;
                isGrounded = true;
            }

            // --- Ball Mechanics Context ---
            if (ballPhysics.isHeld) {
                const carryVector = new THREE.Vector3(0, -0.5, -1.8).applyQuaternion(camera.quaternion);
                basketball.position.copy(camera.position).add(carryVector);
                ballPhysics.velocity.set(0,0,0);
            } else {
                ballPhysics.velocity.y += ballPhysics.gravity;
                basketball.position.add(ballPhysics.velocity);

                if (basketball.position.y < ballPhysics.radius) {
                    basketball.position.y = ballPhysics.radius;
                    ballPhysics.velocity.y = -ballPhysics.velocity.y * ballPhysics.bounciness;
                    ballPhysics.velocity.x *= 0.98;
                    ballPhysics.velocity.z *= 0.98;
                }

                if (Math.abs(basketball.position.x) > 14 || Math.abs(basketball.position.z) > 7.5) {
                    ballPhysics.velocity.x *= -1;
                    ballPhysics.velocity.z *= -1;
                }

                let distanceToRim = basketball.position.distanceTo(hoopRim.position);
                if (distanceToRim < 0.6 && ballPhysics.velocity.y < 0) {
                    score += 2;
                    document.getElementById('hud-score').innerText = `SCORE: ${score}`;
                    document.getElementById('hud-status').innerText = "BUCKET!!";
                    setTimeout(() => { document.getElementById('hud-status').innerText = "LIVE PLAYGROUND"; }, 1500);
                    
                    basketball.position.set(12.4, 2.5, 0);
                    ballPhysics.velocity.set(0, 0, 0);
                }

                let distToUser = camera.position.distanceTo(basketball.position);
                if (distToUser < 3.0) {
                    document.getElementById('interaction-prompt').style.display = 'block';
                } else {
                    document.getElementById('interaction-prompt').style.display = 'none';
                }
            }

            // --- Animate the Jumping Crowd ---
            crowdMembers.forEach(fan => {
                fan.userData.jumpPhase += fan.userData.jumpSpeed;
                fan.position.y = 0.6 + Math.abs(Math.sin(fan.userData.jumpPhase)) * 0.5;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        initEngine();
        animate();
    </script>
</body>
</html>
